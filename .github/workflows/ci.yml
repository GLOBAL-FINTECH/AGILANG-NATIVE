name: Native Runtime CI
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo run -p agilang-compat-audit --
      - run: cargo test --workspace --all-features
      - run: cargo build --workspace --release --all-features
      - run: cargo run -p agilang-runtime-cli -- doctor
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          cargo build -p agilang-runtime-abi --release
          cargo build -p agilang-native-cli --release
          $ToolchainRoot = Join-Path $env:RUNNER_TEMP 'agilang-toolchain'
          $env:AGILANG_RUNTIME_LIB = "$PWD\target\release\agilang_runtime_abi.lib"
          & "$PWD\target\release\agilang.exe" install --root $ToolchainRoot --force
          $env:Path = "$ToolchainRoot\bin;$env:Path"
          agilang version --verbose
          agilang paths
          agilang doctor
          agilang check examples/native/hello-native.agi
          agilang run examples/native/hello-native.agi
      - if: runner.os != 'Windows'
        shell: bash
        run: |
          bash ./scripts/production-readiness.sh

  c-abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p agilang-runtime-abi --release
      - run: cc -Wall -Wextra -Werror -Iinclude examples/c/smoke.c -Ltarget/release -lagilang_runtime_abi -Wl,-rpath,'$ORIGIN/../../target/release' -o examples/c/smoke
      - run: ./examples/c/smoke
