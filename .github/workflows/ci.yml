name: Native Runtime CI
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo build --workspace --release
      - run: cargo run -p agilang-runtime-cli -- doctor

  c-abi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p agilang-runtime-abi --release
      - run: cc -Wall -Wextra -Werror -Iinclude examples/c/smoke.c -Ltarget/release -lagilang_runtime_abi -Wl,-rpath,'$ORIGIN/../../target/release' -o examples/c/smoke
      - run: ./examples/c/smoke
