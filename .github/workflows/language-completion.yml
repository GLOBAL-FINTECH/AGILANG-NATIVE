name: AGILANG Native Language Completion

on:
  pull_request:
    paths:
      - "crates/agilang-compiler/**"
      - "crates/agilang-parser/**"
      - "crates/agilang-semantic/**"
      - "crates/agilang-types/**"
      - "crates/agilang-ir/**"
      - "crates/agilang-codegen-c/**"
      - "compat/**"
      - ".github/workflows/language-completion.yml"
  push:
    branches: [main]

jobs:
  language-completion:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo check -p agilang-types -p agilang-parser -p agilang-semantic -p agilang-compiler -p agilang-codegen-c
      - run: cargo clippy -p agilang-types -p agilang-parser -p agilang-semantic -p agilang-compiler -p agilang-codegen-c --all-targets -- -D warnings
      - run: cargo test -p agilang-types -p agilang-parser -p agilang-semantic -p agilang-compiler -p agilang-codegen-c
      - run: cargo run -p agilang-native-cli -- check examples/native/arrays.agi
      - run: cargo run -p agilang-native-cli -- run examples/native/arrays.agi
