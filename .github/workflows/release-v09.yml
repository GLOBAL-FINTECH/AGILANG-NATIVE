name: AGILANG Native signed distribution
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - shell: bash
        run: |
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then cp target/${{ matrix.target }}/release/agilang.exe dist/agilang.exe; else cp target/${{ matrix.target }}/release/agilang dist/agilang; fi
          sha256sum dist/* > SHA256SUMS 2>/dev/null || shasum -a 256 dist/* > SHA256SUMS
          tar -czf agilang-native-${{ matrix.target }}.tar.gz dist SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: agilang-native-${{ matrix.target }}.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            agilang-native-${{ matrix.target }}.tar.gz
            SHA256SUMS
