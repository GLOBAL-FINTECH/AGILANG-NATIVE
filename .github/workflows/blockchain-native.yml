name: Native Blockchain

on:
  push:
    branches:
      - main
      - feat/genesis-blockchain-native-slice-1
    paths:
      - 'crates/agilang-blockchain-*/**'
      - 'compat/blockchain/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/blockchain-native.yml'
  pull_request:
    paths:
      - 'crates/agilang-blockchain-*/**'
      - 'compat/blockchain/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/blockchain-native.yml'

jobs:
  blockchain:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.81.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Check blockchain crates
        run: cargo check -p agilang-blockchain-core -p agilang-blockchain-storage -p agilang-blockchain-state -p agilang-blockchain-node -p agilang-blockchain-consensus -p agilang-blockchain-rpc -p agilang-blockchain-p2p -p agilang-blockchain-transaction -p agilang-blockchain-service
      - name: Clippy blockchain crates
        run: cargo clippy -p agilang-blockchain-core -p agilang-blockchain-storage -p agilang-blockchain-state -p agilang-blockchain-node -p agilang-blockchain-consensus -p agilang-blockchain-rpc -p agilang-blockchain-p2p -p agilang-blockchain-transaction -p agilang-blockchain-service --all-targets -- -D warnings
      - name: Test blockchain crates
        run: cargo test -p agilang-blockchain-core -p agilang-blockchain-storage -p agilang-blockchain-state -p agilang-blockchain-node -p agilang-blockchain-consensus -p agilang-blockchain-rpc -p agilang-blockchain-p2p -p agilang-blockchain-transaction -p agilang-blockchain-service
