[package]
name = "agilang-runtime-accelerator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
vulkan = ["dep:wgpu", "dep:pollster"]

[dependencies]
agilang-runtime-core = { path = "../agilang-runtime-core" }
serde.workspace = true
serde_json.workspace = true
wgpu = { version = "23.0.1", default-features = false, features = ["wgsl", "vulkan"], optional = true }
pollster = { version = "0.4", optional = true }
